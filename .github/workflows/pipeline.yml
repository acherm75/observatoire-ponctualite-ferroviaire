name: Pipeline quotidien

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 6 h UTC
  workflow_dispatch:       # lancement manuel depuis l'onglet Actions
    inputs:
      force:
        description: "Republier les données même si rien n'a changé"
        type: boolean
        default: false
  pull_request:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # L'historique météo (1950-2024) ne change qu'une fois par an : on le met en cache.
      - name: Cache de l'historique météo
        uses: actions/cache@v6
        with:
          path: data/raw/meteo/meteo_previous_*.parquet
          key: meteo-previous-v1

      - name: Lancer le pipeline (ingestion -> dbt build -> ML -> export)
        run: python pipeline.py ${{ inputs.force && '--force' || '' }}

      - name: Publier les données mises à jour
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marts
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
          else
            git commit -m "data: mise à jour automatique du $(date -u +%Y-%m-%d)"
            # L'archivage temps réel pousse aussi sur main : on se remet à jour avant de pousser.
            for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1
          fi
