name: ponctualite
version: "1.0.0"
config-version: 2
profile: ponctualite

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ponctualite:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  ponctualite:
    +schema: ref
    ref_departements:
      +column_types: {code_departement: varchar}
    ref_gares:
      +column_types: {code_departement: varchar}
